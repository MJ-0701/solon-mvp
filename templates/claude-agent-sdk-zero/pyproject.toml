[project]
name = "<PROJECT-NAME>"
version = "0.1.0"
description = "<DOMAIN> — Solon-methodology Claude Agent SDK project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  # Pin loose; the SDK is moving fast and breaking changes happen.
  "claude-agent-sdk>=0.1.0",
  # The Solon MCP server (separate package; brings sfs_* tools into the agent).
  "solon-mcp>=0.7.0",
  # YAML loader for the solon-safe-permissions.yaml preset.
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
"<PROJECT-NAME>" = "agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent.py"]
