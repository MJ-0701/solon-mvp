# .sfs-local/model-profiles.yaml
# Project-local model and agent profile settings for Solon.
# Installed by Solon <SOLON-VERSION> on <DATE>.
#
# This file is intentionally editable by the project owner. Solon recommends
# cost-aware defaults, but does not block an "all high-end models" policy when
# the project accepts the cost and latency.

version: 1.9
project: "<PROJECT-NAME>"
created: "<DATE>"
solon_mvp_version: "<SOLON-VERSION>"

configuration:
  status: "<MODEL-PROFILE-STATUS>"        # default_applied | selected_at_install | confirmed | current_model_fallback | review_required
  selected_runtime: "<DEFAULT-RUNTIME>"   # current | claude | codex | gemini | custom
  selected_policy: "<MODEL-POLICY>"       # current_model | solon_recommended | all_high | custom
  confirmed_by: ""
  confirmed_at: ""
  note: "Solon recommended role routing applies by default. `current` means infer the active host runtime where possible. Use selected_policy=current_model only when the project explicitly wants the host's currently selected model for every role."
  invocation_note: "Model names are role/profile targets, not a requirement that every CLI supports a --model flag. Default bridges express the requested role/profile in the prompt and rely on the host/runtime configured model; set SFS_REVIEW_<EXECUTOR>_CMD only when a known-good CLI command needs an explicit override."

# ── Multi-agent team topology (opt-in; default solo = 0 behavior change) ──────
# OCP 1원칙: runtime 은 데이터(runtime_registry)로 안다. 역할 재배치나 새 CLI 추가는
# 이 섹션 편집만으로 끝나고 분기 코드 수정은 0 이다. team_preset 이 solo 면 dispatch
# 가 off 이고 모든 role 이 configuration.selected_runtime 으로 resolve 된다(standalone).
# resolution 은 순수 데이터 조회다: resolve-runtime <token> = agent_runtime_bindings
# 조회 → 없으면 selected_runtime fallback. 자세한 설계는 dist
# docs/maintenance/2026-06-23-multi-agent-team-topology.design.md.
team_preset: solo                          # solo | pair | trio (install-time prefill 선택)

runtime_registry:                          # 데이터로 표현한 CLI 호출 추상화 (단일 확장점)
  claude:
    invoke: "claude -p {prompt} --output-format json --allowedTools {tools}"
    capabilities: [plan, review, docs, code]
    models_ref: claude                     # 기존 runtime_model_settings 참조
  codex:
    invoke: "codex exec {prompt} --sandbox workspace-write"
    env: { CODEX_NON_INTERACTIVE: "1" }
    capabilities: [code, refactor]
    models_ref: codex
  antigravity:                             # gemini-cli 공식 후속(`agy`), 현역 default
    invoke: "agy -p {prompt} --output-format json"
    capabilities: [research, analyze, code]
    models_ref: gemini
  gemini:                                  # DEPRECATED: 개인 Pro/Ultra 2026-06-18 sunset
    invoke: "gemini -p {prompt} --non-interactive --output-format json --yolo"
    capabilities: [research, analyze]
    models_ref: gemini
    deprecated: "use antigravity"
  # 미래의 N번째 CLI = 여기에 항목 추가만. 분기 코드 수정 0 → OCP.

# role → runtime binding. key 는 cluster(lead/worker/researcher) 또는 개별 role.
# solo 는 비움({}) → 모든 role 이 selected_runtime 으로 fallback (현재 동작 그대로).
# 비-solo preset 은 block 스타일로 채운다. 예:
#   agent_runtime_bindings:
#     lead:        claude        # plan / ceo / review / docs 클러스터
#     worker:      codex         # implementation-worker / dev division
#     researcher:  antigravity   # research_high
# 재배치는 한 줄만 바꾸면 된다(lead: claude → lead: codex). 분기 코드 불변 → OCP.
agent_runtime_bindings: {}

# preset → binding 묶음 (닫힌 기본값; 데이터, 코드 아님). install/upgrade 의 --team
# <preset> 은 여기서 묶음을 읽어 위 agent_runtime_bindings 블록을 채운다
# (`sfs team preset-bindings <preset>` 가 read-only 로 방출). solo 는 비움이라
# 무변경. **새 preset 신설 = 여기 묶음 한 개 추가, install 코드 diff 0 → OCP.**
team_preset_catalog:
  solo: {}                                 # 모든 role → selected_runtime fallback
  pair:                                    # lead=설계/리뷰/문서, worker=구현
    lead: claude
    worker: codex
  trio:                                    # + researcher=리서치 (기본 추천)
    lead: claude
    worker: codex
    researcher: antigravity

unassigned_role_policy: use_selected_runtime   # 미배정 role 의 standalone fallback

role_boundaries:
  intake_facilitator:
    owns: "missing-argument prompts, user-answer relay, lightweight summaries, and focused brainstorm questions before plan"
    cannot: "make product identity, architecture, gate, acceptance-criteria, or files_scope decisions without C-Level escalation and advisor review"
  c_level:
    owns: "intent, architecture, public contract, acceptance criteria, files_scope, escalation, and review orchestration"
    cannot: "act as the normal implementation worker or approve its own output"
  advisor:
    owns: "top-model review of lower-model question framing, answer interpretation, product direction, architecture, AC, files_scope, and gate advancement"
    runtime_model: "the highest configured runtime tier: Claude Opus 4.7, Codex gpt-5.5/xhigh, Gemini gemini-3.1-pro-preview, or the custom high-end equivalent"
    cannot: "be replaced by the lower model whose output is under review"
  self_cpo_check:
    owns: "local CPO mini-check before external/Codex/Claude/Gemini cross review"
    requires: "pass/partial/fail plus requirements-to-AC-to-slice-to-ADR traceability, AC-to-file/artifact/evidence mapping, and SEED/placeholder/mock/fallback non-acceptance check"
    cannot: "be replaced by advisor consultation, review count, or external cross review"
  worker_generator:
    owns: "fixed implementation slices after plan review passes when the slice still requires coding judgment or behavior shaping"
    cannot: "change architecture, AC, or files_scope silently; absorb judgment-free mechanical fix-ups that should route to mechanical-implementation-helper"
  coding_helper:
    owns: "bounded repo-aware coding helpers when the task is smaller than a normal worker slice but still needs code judgment"
    cannot: "own broad implementation, architecture, AC, public contracts, or files_scope decisions"
  mechanical_implementation_helper:
    owns: "file moves, import/path rewrites, generated index sync, formatting, deterministic test expectation updates, and other bounded implementation chores after C-Level locks scope, files_scope, and AC"
    cannot: "interpret requirements, change behavior, expand files_scope, alter public contracts, or decide acceptance-criteria meaning"
  parallel_implement:
    default_mode: "single"
    optional_mode: "parallel"
    allowed_when: "the plan splits into independent lanes with disjoint files_scope, AC/ADR subset ownership, and a one-sentence proposed commit message per lane"
    requires: "expected tests/evidence, output report path, merge/conflict policy, lane-level verification, agent cross review, and Gate 6 artifact acceptance review"
    cannot: "split work that cannot be described as coherent commit units with clear acceptance evidence"
  division_council:
    mode: "always_on"
    owns: "phase-by-phase conceptual sub-agent findings for strategy-pm, dev, QA, design, infra, and taxonomy"
    requires: "division_subagent_ledger with finding/evidence/waiver or not-applicable status from brainstorm through Gate 6"
    cannot: "be disabled by abstract activation_state; activation controls depth/escalation, not participation"
  gate_invariant:
    before_implement: "Gate 3 Plan review must pass before worker/generator implementation starts; bypass requires an explicit user waiver."
    after_implement: "Every implementation path routes to Gate 6 review; parallel agent implementation must record cross review before Gate 6 can pass."

reasoning_tiers:
  intake_economy:
    purpose: "Deterministic user I/O relay, missing-argument prompts, short answer summaries, and low-risk status narration"
    cost_latency: "low"
    default_roles:
      - relay-helper
      - missing-argument-helper
    guardrail: "Do not use intake_economy to decide product direction, architecture, gate status, AC, files_scope, or whether a question changes the plan. Helper-grade simple I/O such as verbatim relay, canned missing-argument prompts, and low-risk status narration is advisor-exempt. If intake_economy output is interpreted beyond that simple I/O boundary, advisor review is required before it can affect an SFS artifact or gate."

  facilitator_standard:
    purpose: "Focused question generation, brainstorm facilitation, option framing, and requirement summarization before plan"
    cost_latency: "standard"
    default_roles:
      - intake-facilitator
      - question-facilitator
    requires_advisor_review: "Any facilitator_standard output that frames questions/options, interprets user answers, or changes brainstorm/plan/gate artifacts must be advisor-reviewed by the top-model strategic_high advisor before gate advancement."
    escalate_to: strategic_high
    escalate_when:
      - "a user answer changes product identity, architecture, gate status, AC, files_scope, or an expensive-to-reverse decision"
      - "the question is doing direction design rather than simple I/O"
      - "the facilitator detects a rewrite, public contract change, or product-positioning shift"

  strategic_high:
    purpose: "C-Level direction, architecture, product/technical trade-offs, public contract changes"
    cost_latency: "highest"
    default_roles:
      - ceo
      - cto-generator
    use_when:
      - "requirements or architecture are still open"
      - "public API, security, auth, privacy, data model, or data-loss risk exists"
      - "the decision is expensive to reverse"

  review_high:
    purpose: "Independent CPO/Evaluator review; fork/read-only where the runtime supports it"
    cost_latency: "high"
    enforcement: "The reviewer model is ENFORCED, not a soft target (solon-product#7). A CPO/cross review must run on the runtime's review_high route model (Gemini = gemini-3.1-pro-preview; Claude Opus 4.x; Codex gpt-5.5 xhigh). If the route model cannot be pinned/verified — Codex quota exhaustion with no route-capable Gemini, or a CLI that cannot apply --model — the gate STOPS and surfaces a profile bridge issue rather than silently downgrading to a sub-tier model. Qualification is judged by the invocation --model flag / route pin (or API stats), NOT the reviewer's self-named model in its body text — preview models can self-name a sibling version. Backstopped at runtime by `sfs flowcheck` fcp-reviewer-tier."
    default_roles:
      - self-cpo-checker
      - cpo-evaluator
      - external-reviewer
    use_when:
      - "Gate 3 needs a local self-CPO pass before external/cross review, unless a recorded self-CPO fallback reason covers no other agent subscription, external agent token exhaustion, or cross-review bridge unavailability"
      - "the implementation author must not approve their own work"
      - "release or user-facing quality risk is meaningful"

  research_high:
    purpose: "Read-only codebase/domain research, long-context synthesis, and source mapping before implementation"
    cost_latency: "medium-high"
    default_roles:
      - researcher
    use_when:
      - "the codebase or domain is unfamiliar"
      - "terms, architecture boundaries, dependencies, or prior decisions need mapping"
      - "the generator would otherwise carry too much context into implementation"

  execution_standard:
    purpose: "Implementation worker after plan, architecture, acceptance criteria, and files_scope are fixed, when the slice still requires coding judgment or behavior shaping"
    cost_latency: "standard"
    codex_default: "gpt-5.4"
    codex_helper_boundary: "Codex uses gpt-5.3-codex for bounded repo-aware coding helpers, not as the normal worker default."
    codex_spark_boundary: "Do not use gpt-5.3-codex-spark as the broad implementation worker. Do use Spark through mechanical_implementation_economy for judgment-free implementation chores after scope, files_scope, and AC are locked."
    default_roles:
      - implementation-worker
      - division-worker
    cannot:
      - "approve its own work"
      - "change architecture silently"
      - "expand scope without escalation"
    escalate_to: strategic_high
    escalate_when:
      - "architecture or public API changes"
      - "security, auth, privacy, or data-loss risk"
      - "acceptance criteria or requirements are ambiguous"
      - "same test/review finding fails twice"
      - "files_scope needs to expand"

  code_helper:
    purpose: "Bounded repo-aware coding helper work that is smaller than a normal worker slice but still needs code judgment"
    cost_latency: "standard-low"
    codex_default: "gpt-5.3-codex"
    guardrail: "Use code_helper for narrow coding support after scope/files_scope/AC are fixed. Escalate to execution_standard when the slice becomes broad, behavior-bearing, or coordination-heavy."
    default_roles:
      - coding-helper
    escalate_to: execution_standard

  helper_economy:
    purpose: "Deterministic relay helpers, parsing, grep summaries, JSON/YAML transforms, and non-coding mechanical chores"
    cost_latency: "lowest"
    codex_default: "gpt-5.4-mini"
    guardrail: "Helper economy is for bounded non-coding helper chores, not plan interpretation, architecture decisions, behavior design, code judgment, or broad implementation."
    default_roles:
      - parser
      - formatter
      - sync-helper

  mechanical_implementation_economy:
    purpose: "Judgment-free mechanical implementation chores after C-Level scope, files_scope, AC, and exact edit intent are locked"
    cost_latency: "lowest"
    codex_default: "gpt-5.3-codex-spark"
    guardrail: "Use only when no product or code-design judgment remains: file moves, import/path rewrites, generated index sync, deterministic test expectation updates, and equivalent fixed edits. Escalate to code_helper or execution_standard when interpretation appears."
    default_roles:
      - mechanical-implementation-helper
    escalate_to: code_helper

policies:
  current_model:
    description: "Explicit opt-out from Solon role routing. Use the active model already selected in the current LLM runtime for every role."
    agent_tiers:
      relay-helper: current
      missing-argument-helper: current
      intake-facilitator: current
      question-facilitator: current
      ceo: current
      cto-generator: current
      self-cpo-checker: current
      cpo-evaluator: current
      researcher: current
      implementation-worker: current
      division-worker: current
      coding-helper: current
      mechanical-implementation-helper: current
      parser: current
      formatter: current
      sync-helper: current

  solon_recommended:
    description: "Use low-cost intake for deterministic I/O, standard facilitators for question generation, high reasoning for C-Level/review, standard workers for behavior-bearing fixed implementation, code helpers for bounded repo-aware coding support, economy helpers for non-coding chores, and Spark only for locked judgment-free mechanical implementation in Codex."
    agent_tiers:
      relay-helper: intake_economy
      missing-argument-helper: intake_economy
      intake-facilitator: facilitator_standard
      question-facilitator: facilitator_standard
      ceo: strategic_high
      cto-generator: strategic_high
      self-cpo-checker: review_high
      cpo-evaluator: review_high
      researcher: research_high
      implementation-worker: execution_standard
      division-worker: execution_standard
      coding-helper: code_helper
      mechanical-implementation-helper: mechanical_implementation_economy
      parser: helper_economy
      formatter: helper_economy
      sync-helper: helper_economy

  all_high:
    description: "Allowed. Use high reasoning for every agent/helper when project cost and latency are acceptable."
    agent_tiers:
      relay-helper: strategic_high
      missing-argument-helper: strategic_high
      intake-facilitator: strategic_high
      question-facilitator: strategic_high
      ceo: strategic_high
      cto-generator: strategic_high
      self-cpo-checker: review_high
      cpo-evaluator: review_high
      researcher: research_high
      implementation-worker: strategic_high
      division-worker: strategic_high
      coding-helper: strategic_high
      mechanical-implementation-helper: strategic_high
      parser: strategic_high
      formatter: strategic_high
      sync-helper: strategic_high

  custom:
    description: "Edit agent_defaults.configured_tier and/or agent_model_overrides below."

runtime_model_settings:
  current:
    current:
      model: "active runtime family"
      reasoning_effort: "resolved by selected_policy"
      description: "For solon_recommended, infer the active host runtime family (Claude/Codex/Gemini) and apply that runtime's tier map. For current_model, use whatever model/reasoning setting the user has currently selected."

  claude:
    intake_economy:
      model: "haiku"
      description: "Use only for deterministic relay, missing-argument prompts, low-risk summaries, and tiny read-only helper notes. Haiku must not write code or own implementation."
    facilitator_standard:
      model: "sonnet-4.6"
      description: "Default for SFS question generation and brainstorm facilitation. Escalate to Opus when the question or answer changes product identity, architecture, gate status, AC, or files_scope."
    strategic_high:
      model: "opus-4.7"
      fallback_model: "opus-4.6"
    review_high:
      model: "opus-4.7"
      fallback_model: "opus-4.6"
    research_high:
      model: "sonnet-4.6"
      description: "Claude read-only research fallback. Prefer the Gemini researcher executor with gemini-3.1-pro-preview for substantive research when available."
    execution_standard:
      model: "sonnet-4.6"
      description: "Claude worker tier. This is the first Claude tier allowed to write code."
    code_helper:
      model: "sonnet-4.6"
      description: "Claude bounded coding helper. Haiku must not be used for coding."
    helper_economy:
      model: "haiku"
      description: "Non-coding helper only: relay, formatting summaries, simple extraction, and tiny read-only notes."
    mechanical_implementation_economy:
      model: "sonnet-4.6"
      description: "Claude has no Haiku coding lane; even judgment-free mechanical implementation uses Sonnet 4.6 or delegates to a configured Codex Spark lane."

  codex:
    intake_economy:
      model: "gpt-5.4-mini"
      reasoning_effort: "low"
      description: "Use for deterministic relay, missing-argument prompts, and low-risk summaries. Do not use it for direction-setting questions."
    facilitator_standard:
      model: "gpt-5.4"
      reasoning_effort: "medium"
      description: "Default Codex route for SFS question generation, brainstorm facilitation, option framing, and user-answer summarization before plan. Escalate to gpt-5.5 when the question or answer changes product identity, architecture, gate status, AC, or files_scope."
    strategic_high:
      model: "gpt-5.5"
      reasoning_effort: "xhigh"
      reasoning_label: "very_high"
    review_high:
      model: "gpt-5.5"
      reasoning_effort: "xhigh"
      reasoning_label: "very_high"
    research_high:
      model: "gpt-5.5"
      reasoning_effort: "high"
      reasoning_label: "high"
    execution_standard:
      model: "gpt-5.4"
      reasoning_effort: "medium"
      description: "Default Codex implementation worker for fixed slices that still require coding judgment or behavior shaping. Use code_helper for bounded repo-aware coding support and mechanical_implementation_economy for judgment-free mechanical implementation helper work."
    code_helper:
      model: "gpt-5.3-codex"
      reasoning_effort: "high"
      description: "Codex helper for bounded repo-aware coding support after scope, files_scope, and AC are fixed, when some code judgment remains."
    helper_economy:
      model: "gpt-5.4-mini"
      reasoning_effort: "low"
      description: "Fast Codex helper for deterministic relay, parsing, grep summaries, and non-coding mechanical chores."
    mechanical_implementation_economy:
      model: "gpt-5.3-codex-spark"
      reasoning_effort: "high"
      description: "Codex Spark route for judgment-free mechanical implementation fix-ups only after C-Level has locked scope, files_scope, acceptance criteria, and exact edit intent."

  gemini:
    intake_economy:
      model: "gemini-3.1-flash-lite"
      reasoning_effort: "auto"
      description: "Gemini low-cost relay/probe tier. Use only for simple I/O and tiny helper work; never for product judgment."
    facilitator_standard:
      model: "gemini-3.1-pro-preview"
      reasoning_effort: "auto"
      description: "Default Gemini facilitator/question and planning route; escalate to strategic_high when product meaning or architecture shifts."
    strategic_high:
      model: "gemini-3.1-pro-preview"
      reasoning_effort: "auto"
    review_high:
      model: "gemini-3.1-pro-preview"
      reasoning_effort: "auto"
    research_high:
      model: "gemini-3.1-pro-preview"
      reasoning_effort: "auto"
      description: "Preferred substantive research route when a Gemini executor is available."
    execution_standard:
      model: "gemini-3-flash-preview"
      reasoning_effort: "auto"
      description: "Gemini agentic-coding worker tier for fixed implementation slices after plan/review locks scope, files_scope, and AC."
    code_helper:
      model: "gemini-3-flash-preview"
      reasoning_effort: "auto"
      description: "Gemini bounded repo-aware coding helper tier; not a C-Level, advisor, or review model."
    helper_economy:
      model: "gemini-3.1-flash-lite"
      reasoning_effort: "auto"
      description: "Gemini economy helper for parsing, relay, and cheap probes."
    mechanical_implementation_economy:
      model: "gemini-3-flash-preview"
      reasoning_effort: "auto"
      description: "Gemini locked mechanical implementation helper. Use only after exact edit intent is fixed and no product judgment remains."

  custom:
    intake_economy:
      command_or_model: "<custom-low-cost-intake-command-or-model>"
    facilitator_standard:
      command_or_model: "<custom-facilitator-command-or-model>"
    strategic_high:
      command_or_model: "<custom-high-reasoning-command-or-model>"
    review_high:
      command_or_model: "<custom-review-command-or-model>"
    research_high:
      command_or_model: "<custom-research-command-or-model>"
    execution_standard:
      command_or_model: "<custom-implementation-command-or-model>"
    code_helper:
      command_or_model: "<custom-code-helper-command-or-model>"
    helper_economy:
      command_or_model: "<custom-helper-command-or-model>"
    mechanical_implementation_economy:
      command_or_model: "<custom-mechanical-implementation-helper-command-or-model>"

