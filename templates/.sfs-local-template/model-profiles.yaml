# .sfs-local/model-profiles.yaml
# Project-local model and agent profile settings for Solon.
# Installed by Solon <SOLON-VERSION> on <DATE>.
#
# This file is intentionally editable by the project owner. Solon recommends
# cost-aware defaults, but does not block an "all high-end models" policy when
# the project accepts the cost and latency.

version: 1.5
project: "<PROJECT-NAME>"
created: "<DATE>"
solon_mvp_version: "<SOLON-VERSION>"

configuration:
  status: "<MODEL-PROFILE-STATUS>"        # default_applied | selected_at_install | confirmed | current_model_fallback | review_required
  selected_runtime: "<DEFAULT-RUNTIME>"   # current | claude | codex | gemini | custom
  selected_policy: "<MODEL-POLICY>"       # current_model | solon_recommended | all_high | custom
  confirmed_by: ""
  confirmed_at: ""
  note: "Solon recommended role routing applies by default. `current` means infer the active host runtime where possible. Use selected_policy=current_model only when the project explicitly wants the host's currently selected model for every role."
  invocation_note: "Model names are role/profile targets, not a requirement that every CLI supports a --model flag. Default bridges express the requested role/profile in the prompt and rely on the host/runtime configured model; set SFS_REVIEW_<EXECUTOR>_CMD only when a known-good CLI command needs an explicit override."

role_boundaries:
  intake_facilitator:
    owns: "missing-argument prompts, user-answer relay, lightweight summaries, and focused brainstorm questions before plan"
    cannot: "make product identity, architecture, gate, acceptance-criteria, or files_scope decisions without C-Level escalation and advisor review"
  c_level:
    owns: "intent, architecture, public contract, acceptance criteria, files_scope, escalation, and review orchestration"
    cannot: "act as the normal implementation worker or approve its own output"
  advisor:
    owns: "top-model review of lower-model question framing, answer interpretation, product direction, architecture, AC, files_scope, and gate advancement"
    runtime_model: "the highest configured runtime tier: Claude Opus 4.7, Codex gpt-5.5/xhigh, Gemini gemini-3.1-pro-preview, or the custom high-end equivalent"
    cannot: "be replaced by the lower model whose output is under review"
  self_cpo_check:
    owns: "local CPO mini-check before external/Codex/Claude/Gemini cross review"
    requires: "pass/partial/fail plus requirements-to-AC-to-slice-to-ADR traceability, AC-to-file/artifact/evidence mapping, and SEED/placeholder/mock/fallback non-acceptance check"
    cannot: "be replaced by advisor consultation, review count, or external cross review"
  worker_generator:
    owns: "fixed implementation slices after plan review passes"
    cannot: "change architecture, AC, or files_scope silently"
  parallel_implement:
    default_mode: "single"
    optional_mode: "parallel"
    allowed_when: "the plan splits into independent lanes with disjoint files_scope and a one-sentence proposed commit message per lane"
    requires: "lane-level verification, agent cross review, and Gate 6 artifact acceptance review"
    cannot: "split work that cannot be described as coherent commit units"
  gate_invariant:
    before_implement: "Gate 3 Plan review must pass before worker/generator implementation starts; bypass requires an explicit user waiver."
    after_implement: "Every implementation path routes to Gate 6 review; parallel agent implementation must record cross review before Gate 6 can pass."

reasoning_tiers:
  intake_economy:
    purpose: "Deterministic user I/O relay, missing-argument prompts, short answer summaries, and low-risk status narration"
    cost_latency: "low"
    default_roles:
      - relay-helper
      - missing-argument-helper
    guardrail: "Do not use intake_economy to decide product direction, architecture, gate status, AC, files_scope, or whether a question changes the plan. Helper-grade simple I/O such as verbatim relay, canned missing-argument prompts, and low-risk status narration is advisor-exempt. If intake_economy output is interpreted beyond that simple I/O boundary, advisor review is required before it can affect an SFS artifact or gate."

  facilitator_standard:
    purpose: "Focused question generation, brainstorm facilitation, option framing, and requirement summarization before plan"
    cost_latency: "standard"
    default_roles:
      - intake-facilitator
      - question-facilitator
    requires_advisor_review: "Any facilitator_standard output that frames questions/options, interprets user answers, or changes brainstorm/plan/gate artifacts must be advisor-reviewed by the top-model strategic_high advisor before gate advancement."
    escalate_to: strategic_high
    escalate_when:
      - "a user answer changes product identity, architecture, gate status, AC, files_scope, or an expensive-to-reverse decision"
      - "the question is doing direction design rather than simple I/O"
      - "the facilitator detects a rewrite, public contract change, or product-positioning shift"

  strategic_high:
    purpose: "C-Level direction, architecture, product/technical trade-offs, public contract changes"
    cost_latency: "highest"
    default_roles:
      - ceo
      - cto-generator
    use_when:
      - "requirements or architecture are still open"
      - "public API, security, auth, privacy, data model, or data-loss risk exists"
      - "the decision is expensive to reverse"

  review_high:
    purpose: "Independent CPO/Evaluator review; fork/read-only where the runtime supports it"
    cost_latency: "high"
    default_roles:
      - self-cpo-checker
      - cpo-evaluator
      - external-reviewer
    use_when:
      - "Gate 3 needs a local self-CPO pass before external/cross review"
      - "the implementation author must not approve their own work"
      - "release or user-facing quality risk is meaningful"

  research_high:
    purpose: "Read-only codebase/domain research, long-context synthesis, and source mapping before implementation"
    cost_latency: "medium-high"
    default_roles:
      - researcher
    use_when:
      - "the codebase or domain is unfamiliar"
      - "terms, architecture boundaries, dependencies, or prior decisions need mapping"
      - "the generator would otherwise carry too much context into implementation"

  execution_standard:
    purpose: "Implementation worker after plan, architecture, acceptance criteria, and files_scope are fixed"
    cost_latency: "standard"
    codex_default: "gpt-5.3-codex"
    codex_spark_boundary: "Do not use gpt-5.3-codex-spark as the normal implementation worker. Use Spark only for bounded mechanical subtasks after scope and AC are locked."
    default_roles:
      - implementation-worker
      - division-worker
    cannot:
      - "approve its own work"
      - "change architecture silently"
      - "expand scope without escalation"
    escalate_to: strategic_high
    escalate_when:
      - "architecture or public API changes"
      - "security, auth, privacy, or data-loss risk"
      - "acceptance criteria or requirements are ambiguous"
      - "same test/review finding fails twice"
      - "files_scope needs to expand"

  helper_economy:
    purpose: "Parsing, formatting, grep summaries, JSON/YAML transforms, deterministic helpers"
    cost_latency: "lowest"
    codex_default: "gpt-5.3-codex-spark"
    guardrail: "Helper economy is for bounded mechanical chores, not plan interpretation, architecture decisions, or broad implementation."
    default_roles:
      - parser
      - formatter
      - sync-helper

policies:
  current_model:
    description: "Explicit opt-out from Solon role routing. Use the active model already selected in the current LLM runtime for every role."
    agent_tiers:
      relay-helper: current
      missing-argument-helper: current
      intake-facilitator: current
      question-facilitator: current
      ceo: current
      cto-generator: current
      self-cpo-checker: current
      cpo-evaluator: current
      researcher: current
      implementation-worker: current
      division-worker: current
      parser: current
      formatter: current
      sync-helper: current

  solon_recommended:
    description: "Use low-cost intake for deterministic I/O, standard facilitators for question generation, high reasoning for C-Level/review, standard workers for fixed implementation, and economy helpers for deterministic chores."
    agent_tiers:
      relay-helper: intake_economy
      missing-argument-helper: intake_economy
      intake-facilitator: facilitator_standard
      question-facilitator: facilitator_standard
      ceo: strategic_high
      cto-generator: strategic_high
      self-cpo-checker: review_high
      cpo-evaluator: review_high
      researcher: research_high
      implementation-worker: execution_standard
      division-worker: execution_standard
      parser: helper_economy
      formatter: helper_economy
      sync-helper: helper_economy

  all_high:
    description: "Allowed. Use high reasoning for every agent/helper when project cost and latency are acceptable."
    agent_tiers:
      relay-helper: strategic_high
      missing-argument-helper: strategic_high
      intake-facilitator: strategic_high
      question-facilitator: strategic_high
      ceo: strategic_high
      cto-generator: strategic_high
      self-cpo-checker: review_high
      cpo-evaluator: review_high
      researcher: research_high
      implementation-worker: strategic_high
      division-worker: strategic_high
      parser: strategic_high
      formatter: strategic_high
      sync-helper: strategic_high

  custom:
    description: "Edit agent_defaults.configured_tier and/or agent_model_overrides below."

runtime_model_settings:
  current:
    current:
      model: "active runtime family"
      reasoning_effort: "resolved by selected_policy"
      description: "For solon_recommended, infer the active host runtime family (Claude/Codex/Gemini) and apply that runtime's tier map. For current_model, use whatever model/reasoning setting the user has currently selected."

  claude:
    intake_economy:
      model: "haiku"
      description: "Use only for deterministic relay, missing-argument prompts, and low-risk summaries."
    facilitator_standard:
      model: "sonnet"
      description: "Default for SFS question generation and brainstorm facilitation. Escalate to Opus when the question or answer changes product identity, architecture, gate status, AC, or files_scope."
    strategic_high:
      model: "opus-4.7"
      fallback_model: "opus-4.6"
    review_high:
      model: "opus-4.7"
      fallback_model: "opus-4.6"
    research_high:
      model: "opus-4.7"
      fallback_model: "opus-4.6"
    execution_standard:
      model: "sonnet"
    helper_economy:
      model: "haiku"

  codex:
    intake_economy:
      model: "gpt-5.4-mini"
      reasoning_effort: "low"
      description: "Use for deterministic relay, missing-argument prompts, and low-risk summaries. Do not use it for direction-setting questions."
    facilitator_standard:
      model: "gpt-5.4"
      reasoning_effort: "medium"
      description: "Default Codex route for SFS question generation, brainstorm facilitation, option framing, and user-answer summarization before plan. Escalate to gpt-5.5 when the question or answer changes product identity, architecture, gate status, AC, or files_scope."
    strategic_high:
      model: "gpt-5.5"
      reasoning_effort: "xhigh"
      reasoning_label: "very_high"
    review_high:
      model: "gpt-5.5"
      reasoning_effort: "xhigh"
      reasoning_label: "very_high"
    research_high:
      model: "gpt-5.5"
      reasoning_effort: "high"
      reasoning_label: "high"
    execution_standard:
      model: "gpt-5.3-codex"
      reasoning_effort: "high"
      description: "Default Codex implementation worker for fixed slices. Escalate if the slice touches architecture, public contracts, security, privacy, data loss, release gates, or repeated review failure."
    helper_economy:
      model: "gpt-5.3-codex-spark"
      reasoning_effort: "high"
      description: "Fast Codex helper for bounded mechanical subtasks only after C-Level has locked scope and acceptance criteria."

  gemini:
    intake_economy:
      model: "gemini-3-flash-preview"
      reasoning_effort: "low"
      description: "Gemini helper-grade intake/fallback tier. Do not use Gemini 2.5 fallback names."
    facilitator_standard:
      model: "gemini-3.1-pro-preview"
      reasoning_effort: "medium"
      description: "Default Gemini facilitator/question route. Gemini 3.1 Pro preview is assumed when available."
    strategic_high:
      model: "gemini-3.1-pro-preview"
      reasoning_effort: "very_high"
    review_high:
      model: "gemini-3.1-pro-preview"
      reasoning_effort: "high"
    research_high:
      model: "gemini-3.1-pro-preview"
      reasoning_effort: "high"
    execution_standard:
      model: "gemini-3.1-pro-preview"
      reasoning_effort: "medium"
    helper_economy:
      model: "gemini-3-flash-preview"
      reasoning_effort: "low"

  custom:
    intake_economy:
      command_or_model: "<custom-low-cost-intake-command-or-model>"
    facilitator_standard:
      command_or_model: "<custom-facilitator-command-or-model>"
    strategic_high:
      command_or_model: "<custom-high-reasoning-command-or-model>"
    review_high:
      command_or_model: "<custom-review-command-or-model>"
    research_high:
      command_or_model: "<custom-research-command-or-model>"
    execution_standard:
      command_or_model: "<custom-implementation-command-or-model>"
    helper_economy:
      command_or_model: "<custom-helper-command-or-model>"

agent_defaults:
  relay-helper:
    persona: ""
    recommended_tier: intake_economy
    configured_tier: current
    escalation_tier: facilitator_standard
  missing-argument-helper:
    persona: ""
    recommended_tier: intake_economy
    configured_tier: current
    escalation_tier: facilitator_standard
  intake-facilitator:
    persona: ""
    recommended_tier: facilitator_standard
    configured_tier: current
    escalation_tier: strategic_high
  question-facilitator:
    persona: ""
    recommended_tier: facilitator_standard
    configured_tier: current
    escalation_tier: strategic_high
  ceo:
    persona: ".sfs-local/personas/ceo.md"
    recommended_tier: strategic_high
    configured_tier: current
  cto-generator:
    persona: ".sfs-local/personas/cto-generator.md"
    recommended_tier: strategic_high
    configured_tier: current
  self-cpo-checker:
    persona: ".sfs-local/personas/cpo-evaluator.md"
    recommended_tier: review_high
    configured_tier: current
  cpo-evaluator:
    persona: ".sfs-local/personas/cpo-evaluator.md"
    recommended_tier: review_high
    configured_tier: current
  researcher:
    persona: ".sfs-local/personas/researcher.md"
    recommended_tier: research_high
    configured_tier: current
  implementation-worker:
    persona: ".sfs-local/personas/implementation-worker.md"
    recommended_tier: execution_standard
    configured_tier: current
    escalation_tier: strategic_high
  division-worker:
    persona: ""
    recommended_tier: execution_standard
    configured_tier: current
    escalation_tier: strategic_high
  parser:
    persona: ""
    recommended_tier: helper_economy
    configured_tier: current
  formatter:
    persona: ""
    recommended_tier: helper_economy
    configured_tier: current
  sync-helper:
    persona: ""
    recommended_tier: helper_economy
    configured_tier: current

# Optional concrete per-agent overrides. Leave an agent empty to resolve via:
# configuration.selected_runtime + agent_defaults.<agent>.configured_tier.
# Example for "worker also high-end":
#   implementation-worker:
#     codex:
#       model: "gpt-5.5"
#       reasoning_effort: "very_high"
#     claude:
#       model: "opus-4.7"
agent_model_overrides:
  relay-helper: {}
  missing-argument-helper: {}
  intake-facilitator: {}
  question-facilitator: {}
  ceo: {}
  cto-generator: {}
  self-cpo-checker: {}
  cpo-evaluator: {}
  researcher: {}
  implementation-worker: {}
  division-worker: {}
  parser: {}
  formatter: {}
  sync-helper: {}

resolution_rules:
  - "If selected_runtime is current, missing, or unrecognized, do not block. Infer the active host runtime family where possible; if it cannot be inferred, use the host's current model as a last-resort runtime fallback."
  - "Default install and upgrade apply selected_policy=solon_recommended without asking the user; selected_policy=current_model is an explicit opt-out."
  - "If selected_policy is all_high, resolve every agent through the highest configured tier/profile unless an explicit agent override exists."
  - "Solon recommendations are advisory. Higher-end overrides are allowed when cost/latency are intentional."
  - "Question routing is cost-aware: deterministic relay and missing-argument prompts use intake_economy; focused question generation and brainstorm facilitation use facilitator_standard; product identity, architecture, gate, AC, or files_scope shifts escalate to strategic_high."
  - "Advisor means the highest configured model for the active runtime: Claude Opus 4.7, Codex gpt-5.5 with xhigh reasoning, Gemini gemini-3.1-pro-preview, or the custom high-end equivalent."
  - "For Gemini runtime, assume gemini-3.1-pro-preview for facilitator/advisor/review/worker routes and gemini-3-flash-preview for helper-grade fallback; do not use Gemini 2.5 fallback names."
  - "Do not assume the executor CLI can enforce a model through command-line flags. SFS routing is a prompt/profile contract by default; if a runtime needs explicit model selection, provide a known-good SFS_REVIEW_<EXECUTOR>_CMD or host configuration."
  - "Lower-model advisor rule: helper-grade simple I/O is advisor-exempt. Any lower-model output beyond verbatim relay/canned missing-argument prompts/status narration that frames questions/options, interprets user answers, or affects brainstorm/plan/gate artifacts must be advisor-reviewed by the top-model strategic_high advisor before the gate advances. Lower-model output cannot approve itself."
  - "Advisor consultation is not self-CPO. Before external/Codex/Claude/Gemini cross review, the current author must run self-cpo-checker and record pass/partial/fail with requirements-to-AC-to-slice-to-ADR traceability, AC-to-file/artifact/evidence mapping, and SEED/placeholder/mock/fallback non-acceptance. Missing self-CPO evidence is partial."
  - "Worker/helper outputs still require independent review; a stronger model does not approve its own work."
  - "Single-agent implementation is the default. Multi-agent implementation is opt-in and requires disjoint files_scope, coherent commit-unit messages, lane verification, and cross review."
  - "For Codex runtime, solon_recommended resolves relay-helper and missing-argument-helper to gpt-5.4-mini, intake-facilitator and question-facilitator to gpt-5.4, C-Level/review to gpt-5.5, implementation-worker and division-worker to gpt-5.3-codex, and mechanical helpers to gpt-5.3-codex-spark."
  - "For Codex runtime, solon_recommended resolves implementation-worker and division-worker to gpt-5.3-codex, not gpt-5.5 and not gpt-5.3-codex-spark."
  - "Do not use gpt-5.4-mini or gpt-5.4 as a substitute for gpt-5.5 when the question itself is direction design."
  - "Use gpt-5.3-codex-spark only for helper_economy or explicitly bounded mechanical subtasks after C-Level scope, files_scope, and AC are locked."
  - "If a Codex worker slice touches architecture, public API/contracts, security, privacy, data-loss risk, release gates, or repeated review failure, escalate to strategic_high or an explicit high-end override before coding."

audit_fields:
  required:
    - agent
    - reasoning_tier
    - runtime
    - resolved_model
    - reasoning_effort
    - override_reason
    - approver
