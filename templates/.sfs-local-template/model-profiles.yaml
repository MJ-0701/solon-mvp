resolution_rules:
  - "If selected_runtime is current, missing, or unrecognized, do not block. Infer the active host runtime family where possible; if it cannot be inferred, use the host's current model as a last-resort runtime fallback."
  - "Default install and upgrade apply selected_policy=solon_recommended without asking the user; selected_policy=current_model is an explicit opt-out."
  - "If selected_policy is all_high, resolve every agent through the highest configured tier/profile unless an explicit agent override exists."
  - "Solon recommendations are advisory. Higher-end overrides are allowed when cost/latency are intentional."
  - "Question routing is cost-aware: deterministic relay and missing-argument prompts use intake_economy; focused question generation and brainstorm facilitation use facilitator_standard; product identity, architecture, gate, AC, or files_scope shifts escalate to strategic_high."
  - "Advisor means the highest configured model for the active runtime: Claude Opus 4.7, Codex gpt-5.5 with xhigh reasoning, Gemini gemini-3.1-pro-preview, or the custom high-end equivalent."
  - "For Claude runtime, solon_recommended resolves implementation-worker, division-worker, coding-helper, and mechanical-implementation-helper to sonnet-4.6. Haiku is a non-coding helper tier only and must not write code."
  - "Named-policy precedence (#4): when selected_policy is a named policy (solon_recommended or all_high), policies.<selected_policy>.agent_tiers is authoritative for every agent whose agent_defaults.<agent>.configured_tier is `current`. A per-agent configured_tier set to an explicit non-`current` tier overrides the policy map for that agent only; `current` defers to the selected policy's agent_tiers. selected_policy=current_model resolves every role to the host current model regardless of configured_tier. This closes the worker-tiering leak where every-agent configured_tier=current allowed a worker to resolve to the host model instead of the policy worker tier."
  - "Config-drift validation (warn-only, #4): install, upgrade, and flowcheck must WARN when an agent's tier resolved via selected_policy.agent_tiers differs from what agent_defaults.<agent>.configured_tier would produce (e.g. a worker resolving to the host model instead of the policy worker tier). Do not auto-rewrite configured_tier; surface the divergence and let the project owner decide."
  - "For substantive research, prefer a Gemini researcher executor with gemini-3.1-pro-preview when available; Claude research_high is a Sonnet 4.6 fallback."
  - "For Gemini runtime, use only Gemini 3.x-or-newer route names: gemini-3.1-pro-preview for strategic/research/review, gemini-3-flash-preview for agentic coding and bounded implementation helpers, and gemini-3.1-flash-lite for relay/probe/economy helpers. Do not use the old auto alias, models below 3.x, or unsupported generic aliases."
  - "Do not assume the executor CLI can enforce a model through command-line flags. SFS routing is a prompt/profile contract by default; if a runtime needs explicit model selection, provide a known-good SFS_REVIEW_<EXECUTOR>_CMD or host configuration."
  - "Lower-model advisor rule: helper-grade simple I/O is advisor-exempt. Any lower-model output beyond verbatim relay/canned missing-argument prompts/status narration that frames questions/options, interprets user answers, or affects brainstorm/plan/gate artifacts must be advisor-reviewed by the top-model strategic_high advisor before the gate advances. Lower-model output cannot approve itself."
  - "Advisor consultation is not self-CPO. Before external/Codex/Claude/Gemini cross review, the current author must run self-cpo-checker and record pass/partial/fail with requirements-to-AC-to-slice-to-ADR traceability, AC-to-file/artifact/evidence mapping, and SEED/placeholder/mock/fallback non-acceptance. Missing self-CPO evidence is partial."
  - "GitHub @codex PR/code review, PR approval, or GitHub check PASS is external evidence only. It does not satisfy self-CPO, SFS cross review, sfs review, Gate 3, or Gate 6 PASS by itself; record it as evidence, then still run or record the SFS review gate."
  - "External review PASS is a continuation trigger, not a stopping point. Codex, Claude, Gemini, and future LLM agents must continue with the next unmet SFS review command: self-CPO first via sfs review --gate <n> or sfs review --sprint <id> --gate <n> for a closed sprint, then configured cross review after self-CPO PASS unless a recorded self-CPO fallback reason covers no other agent subscription, external agent token exhaustion, or cross-review bridge unavailability."
  - "Session Continuation Guard: sfs upgrade updates runtime/project context but cannot shrink an already-open LLM conversation. If the host token meter is 30%+ before a new WU/sprint action, 50%+ before a new gate/loop/review handoff, or the same chat spans multiple WUs/sprints or repeated loop wakeups, stop and hand off to a fresh session using compact artifacts."
  - "Fresh-session transfer is lossless autopilot after a Session Continuation Guard trigger: write durable handoff/transfer capsule, invoke host-owned transfer/new-session/archive/clear+resume if available, and resume immediately; otherwise stop with exact next-session prompt; never ask the user to choose same-session vs fresh-session or type /clear, and never call bare clear."
  - "Worker/helper outputs still require independent review; a stronger model does not approve its own work."
  - "Division sub-agent council is always_on from brainstorm through Gate 6: strategy-pm, dev, QA, design, infra, and taxonomy each record finding/evidence/waiver or not-applicable status in division_subagent_ledger. Actual parallel worker lanes remain opt-in."
  - "Single-agent implementation is the default. Multi-agent implementation is opt-in and requires disjoint files_scope, AC/ADR subset ownership, expected tests/evidence, output report path, merge/conflict policy, coherent commit-unit messages, lane verification, and cross review."
  - "For Codex runtime, solon_recommended resolves relay-helper, missing-argument-helper, parser, formatter, and sync-helper to gpt-5.4-mini; intake-facilitator, question-facilitator, implementation-worker, and division-worker to gpt-5.4; C-Level/review/research to gpt-5.5; bounded repo-aware coding-helper to gpt-5.3-codex; and judgment-free mechanical-implementation-helper to gpt-5.3-codex-spark."
  - "For Codex runtime, solon_recommended resolves implementation-worker and division-worker to gpt-5.4 when the slice still needs coding judgment; bounded code helper work resolves to gpt-5.3-codex; judgment-free mechanical implementation helper work resolves to gpt-5.3-codex-spark."
  - "Do not use gpt-5.4-mini or gpt-5.4 as a substitute for gpt-5.5 when the question itself is direction design."
  - "Use gpt-5.3-codex-spark only through mechanical_implementation_economy after C-Level scope, files_scope, AC, and exact edit intent are locked and no product or code-design judgment remains."
  - "If a Codex worker slice touches architecture, public API/contracts, security, privacy, data-loss risk, release gates, or repeated review failure, escalate to strategic_high or an explicit high-end override before coding."

audit_fields:
  required:
    - agent
    - reasoning_tier
    - runtime
    - resolved_model
    - reasoning_effort
    - override_reason
    - approver
