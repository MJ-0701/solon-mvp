# .sfs-local/divisions.yaml
# Solon MVP core activation/depth config (compatibility surface).
# The organization has exactly five organization divisions (strategy-pm, dev, QA, design,
# infra)만 있다. taxonomy는 cross-cutting product function/lens다.
# activation_state controls depth, while all six required council roles participate.
# `divisions` map과 taxonomy entry are legacy compatibility keys for six
# activation slots; taxonomy를 조직 division으로 분류하지 않는다.
# 전체 지식팩/review lens registry 가 아니다.
# Current guidance packs/lenses:
# - backend: dev specialization
# - strategy-pm, qa, design/frontend, infra/DevOps
# - management-admin: finance/bookkeeping/tax/accounting lens
# - taxonomy: cross-cutting language/classification lens, not an org division
# 프로젝트 특성에 따라 activation_state 를 조정하고, 변경 사유는
# `docs/solon/decisions/*.md` 또는 해당 sprint handoff 에 기록.

version: 1.2-division-council
project: "<PROJECT-NAME>"
runtime: claude-code   # (향후) codex / gemini-cli 전환 시 값 변경
created: "<DATE>"
solon_mvp_version: "<SOLON-VERSION>"

divisions:
  dev:
    activation_state: active
    lead: "사용자 직접 (self-lead)"
    notes: "구현 주도. D (do) step 의 main owner."

  strategy-pm:
    activation_state: active
    lead: "사용자 직접"
    notes: "brainstorm / plan / review 산출물 owner. P-1 + P + C step."

  qa:
    activation_state: abstract
    reason: "MVP 1 cycle 에서는 manual smoke test 로 대체. cycle 3 누적 후 activate 검토."

  design:
    activation_state: abstract
    reason: "기존 디자인 시스템 (shadcn/ui 등) 차용. 자체 design 본부 불필요."

  infra:
    activation_state: abstract
    reason: "배포 플랫폼 (<DEPLOY>) 재사용 가정. 필요 시 cycle 2~3 에서 activate 검토."

  taxonomy:
    activation_state: abstract
    reason: "언어/분류 lens 는 cycle 2~3 누적 후 도입. 조직 본부가 아니라 cross-cutting 기능."

# Phase 1 MVP 기본 active slot = dev + strategy-pm 2 개.
# 나머지 4개 compatibility slot은 abstract — lightweight lens 로는 항상 참여하고, 필요 시
# 대화에서 선언적으로 activate 승격.
# backend 와 management-admin 은 별도 knowledge pack/review lens 로 라우팅한다.
