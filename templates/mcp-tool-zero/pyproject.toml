[project]
name = "<PROJECT-NAME>-mcp-tool"
version = "0.1.0"
description = "Custom MCP tool for the <DOMAIN> domain (Solon mcp-tool-zero scaffold)."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
"<PROJECT-NAME>-mcp-tool" = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
