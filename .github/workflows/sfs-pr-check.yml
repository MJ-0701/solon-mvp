name: SFS PR Check (storage validators)

# AC2.6 — mandatory pre-merge storage validators (CI workflow path).
# AC13   — explicit `permissions: contents: read` minimum.
# Runs storage co-location, N:M, sprint.yml schema, and bad-fixture validators
# on every PR + pushes to main.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sfs-pr-check.yml"
      - ".github/workflows/**"
      - "bin/**"
      - "commands/**"
      - "docs/**"
      - "plugins/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "packaging/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "BEGINNER-GUIDE.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "GUIDE.md"
      - "README.md"
      - "RELEASE-NOTES.md"
      - "SFS.md"
      - "BEGINNER-GUIDE/**"
      - "GUIDE/**"
      - "README/**"
      - "install.sh"
      - "install.ps1"
      - "upgrade.sh"
      - "upgrade.ps1"
      - "uninstall.sh"
      - "uninstall.ps1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sfs-pr-check.yml"
      - ".github/workflows/**"
      - "bin/**"
      - "commands/**"
      - "docs/**"
      - "plugins/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "packaging/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "BEGINNER-GUIDE.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "GUIDE.md"
      - "README.md"
      - "RELEASE-NOTES.md"
      - "SFS.md"
      - "BEGINNER-GUIDE/**"
      - "GUIDE/**"
      - "README/**"
      - "install.sh"
      - "install.ps1"
      - "upgrade.sh"
      - "upgrade.ps1"
      - "uninstall.sh"
      - "uninstall.ps1"

permissions:
  contents: read

jobs:
  storage-precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: quality gate (canonical PR invocation)
        env:
          SFS_PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
          SFS_PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          SFS_PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: |
          bash scripts/sfs-quality-gate.sh --root . --mode pr
