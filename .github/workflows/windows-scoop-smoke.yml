name: Windows Scoop Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-scoop-smoke.yml"
      - "bin/**"
      - "install.sh"
      - "install.ps1"
      - "packaging/scoop/**"
      - "templates/**"
      - "VERSION"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-scoop-smoke.yml"
      - "bin/**"
      - "install.sh"
      - "install.ps1"
      - "packaging/scoop/**"
      - "templates/**"
      - "VERSION"

permissions:
  contents: read

jobs:
  scoop-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build local release archive and Scoop bucket
        run: |
          $version = (Get-Content VERSION -First 1).Trim()
          if (-not $version) { throw "VERSION is empty" }

          function Convert-ToFileUrl([string] $Path) {
            return "file:///" + (($Path -replace "\\", "/") -replace " ", "%20")
          }

          $template = Get-Content (Join-Path $env:GITHUB_WORKSPACE "packaging/scoop/sfs.json.template") -Raw
          function New-SfsManifest([string] $PackageVersion, [string] $PackageUrl, [string] $PackageHash, [string] $PackageExtractDir) {
            $manifest = $template.Replace("__VERSION__", $PackageVersion)
            $manifest = $manifest.Replace("__URL__", $PackageUrl)
            $manifest = $manifest.Replace("__SHA256__", $PackageHash)
            $manifest = $manifest.Replace("__EXTRACT_DIR__", $PackageExtractDir)
            return $manifest
          }

          $extractDir = "solon-product-$version"
          $archive = Join-Path $env:RUNNER_TEMP "sfs-$version.zip"
          git archive --format=zip --output="$archive" --prefix="$extractDir/" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $fileUrl = Convert-ToFileUrl $archive

          $previousVersion = "0.0.0"
          $previousExtractDir = "solon-product-$previousVersion"
          $previousRawArchive = Join-Path $env:RUNNER_TEMP "sfs-$previousVersion.raw.zip"
          $previousArchive = Join-Path $env:RUNNER_TEMP "sfs-$previousVersion.zip"
          $previousRoot = Join-Path $env:RUNNER_TEMP "sfs-previous-package"
          git archive --format=zip --output="$previousRawArchive" --prefix="$previousExtractDir/" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -Path $previousRawArchive -DestinationPath $previousRoot -Force
          Set-Content -Path (Join-Path $previousRoot "$previousExtractDir\VERSION") -Value $previousVersion -Encoding UTF8
          if (Test-Path $previousArchive) { Remove-Item $previousArchive -Force }
          Compress-Archive -Path (Join-Path $previousRoot $previousExtractDir) -DestinationPath $previousArchive -Force
          $previousHash = (Get-FileHash $previousArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $previousFileUrl = Convert-ToFileUrl $previousArchive

          $brokenVersion = "0.6.49"
          $brokenExtractDir = "solon-product-$brokenVersion"
          $brokenArchive = Join-Path $env:RUNNER_TEMP "sfs-$brokenVersion.zip"
          git fetch --depth=1 origin "refs/tags/v${brokenVersion}:refs/tags/v${brokenVersion}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git archive --format=zip --output="$brokenArchive" --prefix="$brokenExtractDir/" "v${brokenVersion}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $brokenHash = (Get-FileHash $brokenArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $brokenFileUrl = Convert-ToFileUrl $brokenArchive

          $bucket = Join-Path $env:RUNNER_TEMP "solon-scoop-bucket"
          $bucketDir = Join-Path $bucket "bucket"
          New-Item -ItemType Directory -Force -Path $bucketDir | Out-Null

          $manifest = New-SfsManifest $previousVersion $previousFileUrl $previousHash $previousExtractDir
          Set-Content -Path (Join-Path $bucketDir "sfs.json") -Value $manifest -Encoding UTF8

          git -C $bucket init
          git -C $bucket config user.email "actions@github.com"
          git -C $bucket config user.name "github-actions"
          git -C $bucket add bucket/sfs.json
          git -C $bucket commit -m "test bucket previous package"

          $bucketUrl = Convert-ToFileUrl $bucket
          "SFS_TEST_BUCKET_URL=$bucketUrl" >> $env:GITHUB_ENV
          "SFS_TEST_BUCKET_DIR=$bucket" >> $env:GITHUB_ENV
          "SFS_TEST_VERSION=$version" >> $env:GITHUB_ENV
          "SFS_TEST_PREVIOUS_VERSION=$previousVersion" >> $env:GITHUB_ENV
          "SFS_TEST_BROKEN_VERSION=$brokenVersion" >> $env:GITHUB_ENV
          "SFS_TEST_CURRENT_URL=$fileUrl" >> $env:GITHUB_ENV
          "SFS_TEST_CURRENT_SHA256=$hash" >> $env:GITHUB_ENV
          "SFS_TEST_CURRENT_EXTRACT_DIR=$extractDir" >> $env:GITHUB_ENV
          "SFS_TEST_BROKEN_URL=$brokenFileUrl" >> $env:GITHUB_ENV
          "SFS_TEST_BROKEN_SHA256=$brokenHash" >> $env:GITHUB_ENV
          "SFS_TEST_BROKEN_EXTRACT_DIR=$brokenExtractDir" >> $env:GITHUB_ENV

      - name: Install Scoop
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          "$env:USERPROFILE\scoop\shims" >> $env:GITHUB_PATH
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop --version

      - name: Install SFS from local bucket
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add solon $env:SFS_TEST_BUCKET_URL
          scoop install sfs
          $sfsCmd = Get-Command sfs.cmd
          $sfsCmd
          $shimText = Get-Content $sfsCmd.Source -Raw
          if ($shimText -notmatch "SFS_NATIVE_ARGC" -or $shimText -notmatch "SFS_NATIVE_RAW_ARGS" -or $shimText -notmatch "SFS_NATIVE_CMDLINE" -or $shimText -notmatch "%\*") {
            throw "sfs.cmd shim was not hardened with env, raw, and cmdline forwarding: $($sfsCmd.Source)"
          }
          if ($shimText -match "--% %SFS_NATIVE_RAW_ARGS%") {
            throw "sfs.cmd shim still uses the broken --% raw-tail bridge: $($sfsCmd.Source)"
          }
          $env:SFS_WINDOWS_ARG_TRACE = "1"
          $argTraceLines = & sfs.cmd version 2>&1
          $argTraceExit = $LASTEXITCODE
          $argTraceOutput = ($argTraceLines | Out-String)
          Write-Host $argTraceOutput
          Remove-Item Env:SFS_WINDOWS_ARG_TRACE -ErrorAction SilentlyContinue
          if ($argTraceExit -ne 0) { exit $argTraceExit }
          if ($argTraceOutput -notmatch "SFS_ARGTRACE_CMD_ARGC" -or $argTraceOutput -notmatch "SFS_ARGTRACE_PS_SELECTED_SOURCE=env" -or $argTraceOutput -notmatch "SFS_ARGTRACE_PS_FINAL_ARGS=.*version") {
            throw "sfs.cmd arg trace did not prove version reached sfs.ps1: $argTraceOutput"
          }
          if ($argTraceOutput -notmatch "sfs $env:SFS_TEST_PREVIOUS_VERSION") {
            throw "sfs.cmd arg trace did not recover previous runtime version: $argTraceOutput"
          }
          sfs.cmd version
          sfs.cmd --help
          $installedVersion = ((sfs.cmd version).Trim() -replace "^sfs\s+", "")
          if ($installedVersion -ne $env:SFS_TEST_PREVIOUS_VERSION) {
            throw "expected initial test package $env:SFS_TEST_PREVIOUS_VERSION, got $installedVersion"
          }

      - name: Smoke thin project in PowerShell
        timeout-minutes: 15
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          $project = Join-Path $env:RUNNER_TEMP "sfs test-project"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Set-Location $project

          git init
          # Bridge diagnosis (red since 0.8.54): native ps1 commands pass while
          # bash-bridge commands silently no-op with rc 0 on the pwsh runner.
          # Trace the first bridge call and fail fast with hard evidence.
          Write-Host "::group::sfs.cmd init live trace (bash bridge diagnosis)"
          Write-Host "[sfs-trace] PSVersion=$($PSVersionTable.PSVersion) PSNativeCommandArgumentPassing=$PSNativeCommandArgumentPassing"
          $env:SFS_WINDOWS_ARG_TRACE = "1"
          & sfs.cmd init --layout thin --yes 2>&1 | Tee-Object -Variable initTrace
          $initExit = $LASTEXITCODE
          Remove-Item Env:SFS_WINDOWS_ARG_TRACE -ErrorAction SilentlyContinue
          Write-Host "[sfs-trace] init exit=$initExit"
          Write-Host "::endgroup::"
          if ($initExit -ne 0) { throw "sfs.cmd init failed with exit ${initExit}: $($initTrace | Out-String)" }
          if (-not (Test-Path ".sfs-local" -PathType Container)) {
            throw "sfs.cmd init returned 0 but created no .sfs-local (silent bash-bridge no-op). Trace: $($initTrace | Out-String)"
          }
          sfs.cmd status
          sfs.cmd auth status codex
          sfs.cmd context cat kernel | Out-String | Select-String "SFS Kernel" | Out-Null
          sfs.cmd context cat commands/start.md | Out-String | Select-String "start" | Out-Null
          sfs.cmd start --id ci-sprint-test "sprint-create-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $currentSprint = (Get-Content ".sfs-local\current-sprint" -First 1).Trim()
          if ($currentSprint -ne "ci-sprint-test") {
            throw "sfs.cmd start did not update current-sprint: $currentSprint"
          }
          $lastEvent = Get-Content ".sfs-local\events.jsonl" -Tail 1
          if ($lastEvent -notmatch '"type":"sprint_start"' -or $lastEvent -notmatch '"goal":"sprint-create-test"') {
            throw "sfs.cmd start did not append the expected sprint_start event: $lastEvent"
          }
          sfs.cmd status | Out-String | Select-String "ci-sprint-test" | Out-Null

          $required = @(
            "SFS.md",
            "CLAUDE.md",
            "AGENTS.md",
            "GEMINI.md",
            ".sfs-local\VERSION",
            ".sfs-local\config.yaml"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "missing expected installed file: $path" }
          }

          $forbidden = @(
            ".claude\commands\sfs.md",
            ".claude\skills\sfs\SKILL.md",
            ".gemini\commands\sfs.toml",
            ".agents\skills\sfs\SKILL.md",
            ".sfs-local\scripts",
            ".sfs-local\sprint-templates",
            ".sfs-local\personas",
            ".sfs-local\decisions-template"
          )
          foreach ($path in $forbidden) {
            if (Test-Path $path) { throw "thin layout copied project-local asset unexpectedly: $path" }
          }

          sfs.cmd agent install all
          $adapterFiles = @(
            ".claude\commands\sfs.md",
            ".claude\skills\sfs\SKILL.md",
            ".gemini\commands\sfs.toml",
            ".agents\skills\sfs\SKILL.md"
          )
          foreach ($path in $adapterFiles) {
            if (-not (Test-Path $path)) { throw "missing expected opt-in adapter file: $path" }
          }

          $template = Get-Content (Join-Path $env:GITHUB_WORKSPACE "packaging/scoop/sfs.json.template") -Raw
          $manifest = $template.Replace("__VERSION__", $env:SFS_TEST_VERSION)
          $manifest = $manifest.Replace("__URL__", $env:SFS_TEST_CURRENT_URL)
          $manifest = $manifest.Replace("__SHA256__", $env:SFS_TEST_CURRENT_SHA256)
          $manifest = $manifest.Replace("__EXTRACT_DIR__", $env:SFS_TEST_CURRENT_EXTRACT_DIR)
          Set-Content -Path (Join-Path $env:SFS_TEST_BUCKET_DIR "bucket\sfs.json") -Value $manifest -Encoding UTF8
          git -C $env:SFS_TEST_BUCKET_DIR add bucket/sfs.json
          git -C $env:SFS_TEST_BUCKET_DIR commit -m "test bucket current package"

          Write-Host "::group::sfs.cmd upgrade live trace"
          Write-Host "[sfs-trace] upgrade start $(Get-Date -Format o)"
          $env:SFS_WINDOWS_ARG_TRACE = "1"
          $env:SFS_UPGRADE_TRACE = "1"
          $env:SFS_CLI_DISCOVERY_TIMEOUT_SEC = "30"
          $env:SFS_DISCOVERY_CMD_TIMEOUT_SEC = "5"
          & sfs.cmd upgrade 2>&1 | Tee-Object -Variable upgradeTrace
          $upgradeExit = $LASTEXITCODE
          Remove-Item Env:SFS_WINDOWS_ARG_TRACE -ErrorAction SilentlyContinue
          Remove-Item Env:SFS_UPGRADE_TRACE -ErrorAction SilentlyContinue
          Remove-Item Env:SFS_CLI_DISCOVERY_TIMEOUT_SEC -ErrorAction SilentlyContinue
          Remove-Item Env:SFS_DISCOVERY_CMD_TIMEOUT_SEC -ErrorAction SilentlyContinue
          Write-Host "[sfs-trace] upgrade exit=$upgradeExit $(Get-Date -Format o)"
          Write-Host "::endgroup::"
          $upgradeOutput = ($upgradeTrace | Out-String)
          if ($upgradeExit -ne 0) { exit $upgradeExit }
          if ($upgradeOutput -match "TIVE_READONLY_DONE|LF_UPGRADE_DONE|'e'.*(recognized|은\(는\))|'\*'.*(recognized|은\(는\))") {
            throw "sfs.cmd upgrade printed batch tail-fragment evidence: $upgradeOutput"
          }
          if ($upgradeOutput -notmatch "SFS_ARGTRACE_PS_AFTER_BASH_BRIDGE_LASTEXITCODE=0") {
            throw "sfs.cmd upgrade did not prove the final Bash bridge returned to PowerShell: $upgradeOutput"
          }

          $projectVersion = (Select-String -Path ".sfs-local\VERSION" -Pattern "^solon_mvp_version:\s*(.+)$").Matches.Groups[1].Value.Trim()
          $runtimeVersion = ((sfs.cmd version).Trim() -replace "^sfs\s+", "")
          if ($runtimeVersion -ne $env:SFS_TEST_VERSION) {
            throw "sfs.cmd upgrade did not refresh runtime VERSION: runtime=$runtimeVersion expected=$env:SFS_TEST_VERSION"
          }
          if ($projectVersion -ne $runtimeVersion) {
            throw "sfs.cmd upgrade did not refresh project VERSION: project=$projectVersion runtime=$runtimeVersion"
          }
          foreach ($path in $adapterFiles) {
            if (Test-Path $path) { throw "sfs.cmd upgrade left thin adapter file: $path" }
          }
          $adapterArchives = Get-ChildItem ".sfs-local\archives\runtime-migrations" -Filter "project-agent-adapters.tar.gz" -Recurse -ErrorAction SilentlyContinue
          if (-not $adapterArchives) {
            $collapsedArchives = Get-ChildItem ".sfs-local\archives\adopt" -Filter "preexisting-archives.tar.gz" -Recurse -ErrorAction SilentlyContinue
            foreach ($archive in $collapsedArchives) {
              $listing = & tar -tzf $archive.FullName 2>$null
              if ($LASTEXITCODE -eq 0 -and ($listing -match "project-agent-adapters\.tar\.gz")) {
                $adapterArchives = @($archive)
                break
              }
            }
          }
          if (-not $adapterArchives) {
            $surfaceArchives = Get-ChildItem ".sfs-local\archives\adopt\surface-cleanup" -Filter "surface-cleanup.tar.gz" -Recurse -ErrorAction SilentlyContinue
            foreach ($surfaceArchive in $surfaceArchives) {
              $surfaceListing = & tar -tzf $surfaceArchive.FullName 2>$null
              if ($LASTEXITCODE -eq 0 -and ($surfaceListing -match "project-agent-adapters\.tar\.gz")) {
                $adapterArchives = @($surfaceArchive)
                break
              }
              $surfaceExtract = Join-Path $env:RUNNER_TEMP ("sfs-surface-check-" + [Guid]::NewGuid().ToString())
              New-Item -ItemType Directory -Force -Path $surfaceExtract | Out-Null
              & tar -xzf $surfaceArchive.FullName -C $surfaceExtract 2>$null
              if ($LASTEXITCODE -eq 0) {
                $nestedArchives = Get-ChildItem $surfaceExtract -Filter "preexisting-archives.tar.gz" -Recurse -ErrorAction SilentlyContinue
                foreach ($nestedArchive in $nestedArchives) {
                  $nestedListing = & tar -tzf $nestedArchive.FullName 2>$null
                  if ($LASTEXITCODE -eq 0 -and ($nestedListing -match "project-agent-adapters\.tar\.gz")) {
                    $adapterArchives = @($nestedArchive)
                    break
                  }
                }
              }
              Remove-Item $surfaceExtract -Recurse -Force -ErrorAction SilentlyContinue
              if ($adapterArchives) { break }
            }
          }
          if (-not $adapterArchives) {
            throw "sfs.cmd upgrade did not archive opt-in adapter files"
          }

          sfs.cmd start --id ci-korean-sprint-test --force "스프린트 생성 테스트"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $currentSprint = (Get-Content ".sfs-local\current-sprint" -First 1).Trim()
          if ($currentSprint -ne "ci-korean-sprint-test") {
            throw "sfs.cmd Korean start did not update current-sprint: $currentSprint"
          }
          $lastEvent = Get-Content ".sfs-local\events.jsonl" -Tail 1
          if ($lastEvent -notmatch '"type":"sprint_start"' -or $lastEvent -notmatch '"goal":"스프린트 생성 테스트"') {
            throw "sfs.cmd Korean start did not append the expected Korean sprint_start event: $lastEvent"
          }
          sfs.cmd status | Out-String | Select-String "ci-korean-sprint-test" | Out-Null

      - name: Smoke saved cmdline fallback
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          $project = Join-Path $env:RUNNER_TEMP "sfs saved-cmdline-project"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Set-Location $project

          git init
          sfs.cmd init --layout thin --yes
          $ps1 = Join-Path $env:USERPROFILE "scoop\apps\sfs\current\bin\sfs.ps1"
          if (-not (Test-Path $ps1)) { throw "missing installed sfs.ps1: $ps1" }

          function Clear-SfsArgBridge {
            Remove-Item Env:SFS_NATIVE_ARGC -ErrorAction SilentlyContinue
            Remove-Item Env:SFS_NATIVE_RAW_ARGS -ErrorAction SilentlyContinue
            Remove-Item Env:SFS_NATIVE_CMDLINE -ErrorAction SilentlyContinue
          }

          function Invoke-SavedCmdline([string] $cmdline) {
            $env:SFS_NATIVE_ARGC = "0"
            Remove-Item Env:SFS_NATIVE_RAW_ARGS -ErrorAction SilentlyContinue
            $env:SFS_NATIVE_CMDLINE = $cmdline
            $lines = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $ps1 2>&1
            $exitCode = $LASTEXITCODE
            $output = ($lines | Out-String)
            Clear-SfsArgBridge
            if ($exitCode -ne 0) {
              throw "saved cmdline fallback failed with exit ${exitCode}: $cmdline`n$output"
            }
            return $output
          }

          $versionOut = Invoke-SavedCmdline 'cmd.exe /d /c "sfs.cmd version && sfs.cmd --help >NUL"'
          if ($versionOut -notmatch "sfs $env:SFS_TEST_VERSION") {
            throw "saved cmdline fallback did not recover version before shell-control tail: $versionOut"
          }

          $contextOut = Invoke-SavedCmdline 'cmd.exe /d /c "sfs.cmd context cat kernel && sfs.cmd --help >NUL"'
          if ($contextOut -notmatch "SFS Kernel") {
            throw "saved cmdline fallback did not recover context cat kernel: $contextOut"
          }

          Invoke-SavedCmdline 'cmd.exe /d /c "sfs.cmd start --id ci-saved-cmdline-test --force saved-cmdline-start && sfs.cmd --help >NUL"' | Out-Null
          $currentSprint = (Get-Content ".sfs-local\current-sprint" -First 1).Trim()
          if ($currentSprint -ne "ci-saved-cmdline-test") {
            throw "saved cmdline fallback start did not update current-sprint: $currentSprint"
          }
          $lastEvent = Get-Content ".sfs-local\events.jsonl" -Tail 1
          if ($lastEvent -notmatch '"type":"sprint_start"' -or $lastEvent -notmatch '"goal":"saved-cmdline-start"') {
            throw "saved cmdline fallback start did not append expected event: $lastEvent"
          }

      - name: Smoke parent cmdline fallback
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          $project = Join-Path $env:RUNNER_TEMP "sfs parent-cmdline-project"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Set-Location $project

          git init
          sfs.cmd init --layout thin --yes
          $ps1 = Join-Path $env:USERPROFILE "scoop\apps\sfs\current\bin\sfs.ps1"
          if (-not (Test-Path $ps1)) { throw "missing installed sfs.ps1: $ps1" }

          $probeCmd = Join-Path $project "sfs.cmd"
          $powershellExe = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $probe = @"
          @echo off
          setlocal EnableExtensions DisableDelayedExpansion
          set "SFS_NATIVE_ARGC=0"
          set "SFS_NATIVE_RAW_ARGS="
          set "SFS_NATIVE_CMDLINE="
          "$powershellExe" -NoProfile -ExecutionPolicy Bypass -File "$ps1"
          exit /b %ERRORLEVEL%
          "@
          Set-Content -Path $probeCmd -Value $probe -Encoding ASCII

          function Invoke-ParentCmdline([string] $tail) {
            $lines = & cmd.exe /d /c "`"$probeCmd`" $tail && `"$probeCmd`" --help >NUL" 2>&1
            $exitCode = $LASTEXITCODE
            $output = ($lines | Out-String)
            if ($exitCode -ne 0) {
              throw "parent cmdline fallback failed with exit ${exitCode}: $tail`n$output"
            }
            return $output
          }

          $parentVersion = Invoke-ParentCmdline "version"
          if ($parentVersion -notmatch "sfs $env:SFS_TEST_VERSION") {
            throw "parent cmdline fallback did not recover version: $parentVersion"
          }

          $parentContext = Invoke-ParentCmdline "context cat kernel"
          if ($parentContext -notmatch "SFS Kernel") {
            throw "parent cmdline fallback did not recover context cat kernel: $parentContext"
          }

          Invoke-ParentCmdline "start --id ci-parent-cmdline-test --force parent-cmdline-start" | Out-Null
          $currentSprint = (Get-Content ".sfs-local\current-sprint" -First 1).Trim()
          if ($currentSprint -ne "ci-parent-cmdline-test") {
            throw "parent cmdline fallback start did not update current-sprint: $currentSprint"
          }
          $lastEvent = Get-Content ".sfs-local\events.jsonl" -Tail 1
          if ($lastEvent -notmatch '"type":"sprint_start"' -or $lastEvent -notmatch '"goal":"parent-cmdline-start"') {
            throw "parent cmdline fallback start did not append expected event: $lastEvent"
          }

      - name: Smoke cmd PATH
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          cmd /c "sfs.cmd version && sfs.cmd --help >NUL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke Git Bash PATH
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path $bash)) {
            $bashCommand = Get-Command bash.exe -ErrorAction SilentlyContinue
            if (-not $bashCommand) { throw "Git Bash not found" }
            $bash = $bashCommand.Source
          }
          & $bash -lc "command -v sfs && sfs version && sfs --help >/dev/null"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Recover broken 0.6.49 shim
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop uninstall sfs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $template = Get-Content (Join-Path $env:GITHUB_WORKSPACE "packaging/scoop/sfs.json.template") -Raw
          $manifest = $template.Replace("__VERSION__", $env:SFS_TEST_BROKEN_VERSION)
          $manifest = $manifest.Replace("__URL__", $env:SFS_TEST_BROKEN_URL)
          $manifest = $manifest.Replace("__SHA256__", $env:SFS_TEST_BROKEN_SHA256)
          $manifest = $manifest.Replace("__EXTRACT_DIR__", $env:SFS_TEST_BROKEN_EXTRACT_DIR)
          Set-Content -Path (Join-Path $env:SFS_TEST_BUCKET_DIR "bucket\sfs.json") -Value $manifest -Encoding UTF8
          git -C $env:SFS_TEST_BUCKET_DIR add bucket/sfs.json
          git -C $env:SFS_TEST_BUCKET_DIR commit -m "test bucket broken 0.6.49 package"

          # Scoop clones buckets when they are added; refresh that clone after
          # each temp-bucket commit so install/update sees the intended manifest.
          scoop update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          scoop install sfs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $brokenOutput = (sfs.cmd version 2>&1 | Out-String)
          Write-Host $brokenOutput
          if ($brokenOutput -notmatch "Usage:") {
            throw "expected broken 0.6.49 sfs.cmd version to print usage before direct Scoop recovery"
          }

          $manifest = $template.Replace("__VERSION__", $env:SFS_TEST_VERSION)
          $manifest = $manifest.Replace("__URL__", $env:SFS_TEST_CURRENT_URL)
          $manifest = $manifest.Replace("__SHA256__", $env:SFS_TEST_CURRENT_SHA256)
          $manifest = $manifest.Replace("__EXTRACT_DIR__", $env:SFS_TEST_CURRENT_EXTRACT_DIR)
          Set-Content -Path (Join-Path $env:SFS_TEST_BUCKET_DIR "bucket\sfs.json") -Value $manifest -Encoding UTF8
          git -C $env:SFS_TEST_BUCKET_DIR add bucket/sfs.json
          git -C $env:SFS_TEST_BUCKET_DIR commit -m "test bucket current recovery package"

          # Direct Scoop recovery must bypass the broken wrapper and refresh the
          # cloned bucket before updating the app package.
          scoop update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          scoop update sfs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $recoveredVersion = ((sfs.cmd version).Trim() -replace "^sfs\s+", "")
          if ($recoveredVersion -ne $env:SFS_TEST_VERSION) {
            throw "direct Scoop recovery did not install current runtime: runtime=$recoveredVersion expected=$env:SFS_TEST_VERSION"
          }
          $sfsCmd = Get-Command sfs.cmd
          $shimText = Get-Content $sfsCmd.Source -Raw
          if ($shimText -notmatch "SFS_NATIVE_ARGC" -or $shimText -notmatch "SFS_NATIVE_RAW_ARGS" -or $shimText -notmatch "SFS_NATIVE_CMDLINE" -or $shimText -notmatch "%\*") {
            throw "recovered sfs.cmd shim was not hardened with env, raw, and cmdline forwarding: $($sfsCmd.Source)"
          }
          if ($shimText -match "--% %SFS_NATIVE_RAW_ARGS%") {
            throw "recovered sfs.cmd shim still uses the broken --% raw-tail bridge: $($sfsCmd.Source)"
          }
          $env:SFS_WINDOWS_ARG_TRACE = "1"
          $argTraceLines = & sfs.cmd version 2>&1
          $argTraceExit = $LASTEXITCODE
          $argTraceOutput = ($argTraceLines | Out-String)
          Write-Host $argTraceOutput
          Remove-Item Env:SFS_WINDOWS_ARG_TRACE -ErrorAction SilentlyContinue
          if ($argTraceExit -ne 0) { exit $argTraceExit }
          if ($argTraceOutput -notmatch "SFS_ARGTRACE_CMD_ARGC" -or $argTraceOutput -notmatch "SFS_ARGTRACE_PS_SELECTED_SOURCE=env" -or $argTraceOutput -notmatch "SFS_ARGTRACE_PS_FINAL_ARGS=.*version") {
            throw "recovered sfs.cmd arg trace did not prove version reached sfs.ps1: $argTraceOutput"
          }
