[project]
name = "solon-mcp"
version = "0.7.0"
description = "MCP server exposing the Solon Product `sfs` 7-step flow as host-agnostic tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Solon Product maintainers" }]
keywords = ["mcp", "solon", "sfs", "agent", "claude", "codex", "gemini"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/MJ-0701/solon-product"
Source = "https://github.com/MJ-0701/solon-product/tree/main/mcp-server"

[project.scripts]
solon-mcp = "solon_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solon_mcp_server.py"]

[tool.hatch.build.targets.sdist]
include = [
  "solon_mcp_server.py",
  "README.md",
  "pyproject.toml",
]
